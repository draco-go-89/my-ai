<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chatbot — Static Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>AI Chatbot</h1>
      <p class="sub">A simple static chatbot port of the Python demo.</p>
    </header>

    <section class="chat-card">
      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="controls" class="controls">
        <input id="nameInput" type="text" placeholder="Your name (optional)" />
        <input id="textInput" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </section>

    <footer>
      <p>Files: <a href="inputname.py">inputname.py</a> • Static demo</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
