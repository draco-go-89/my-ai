<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lubo's AI Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container py-4">
    <header class="mb-3">
      <h1 class="h3 mb-1">Lubo's AI Chatbot</h1>
      <p class="sub mb-0">A simple static chatbot port made with Python.</p>
    </header>

    <section class="chat-card p-3 p-md-4">
      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="controls" class="controls mt-3" autocomplete="off">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-3">
            <input id="nameInput" type="text" class="form-control" placeholder="Your name (optional)" />
          </div>
          <div class="col-12 col-md-7">
            <input id="textInput" type="text" class="form-control" placeholder="Type a message..." autocomplete="off" />
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button id="sendBtn" type="submit" class="btn btn-primary">Send</button>
          </div>
        </div>
      </form>
    </section>

    <footer class="mt-3">
      <p class="text-muted mb-0">
        <a class="footer-link" href="https://www.instagram.com/___lubolabao.1___/" target="_blank" rel="noopener noreferrer">
          Dhrubo Basumatary
        </a>
      </p>
    </footer>
  </main>

  <script src="/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
